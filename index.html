          <circle r="33" fill="none" stroke="#7a5a22" stroke-opacity=".5" stroke-width=".6" stroke-dasharray="1 2.6" />
          <text class="seal__md seal__md--shadow" x="1" y="11.5" text-anchor="middle">MD</text>
          <text class="seal__md seal__md--light" x="-.6" y="9.4" text-anchor="middle">MD</text>
          <text class="seal__md" x="0" y="10.4" text-anchor="middle">MD</text>
          <path d="M-14 22C-6 26 6 26 14 22" fill="none" stroke="#6f5020" stroke-opacity=".55" stroke-width=".9" />
          <path d="M-30 -30C-22 -40 -8 -45 4 -44" fill="none" stroke="#fff6da" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round" />
        </symbol>

        <!-- Satin bow, knot centred at 150,100 -->
        <symbol id="bow" viewBox="0 0 300 230" overflow="visible">
          <g id="bow-half">
            <path d="M146 112C134 142 112 178 84 216L100 206L112 224C130 184 148 146 158 114Z" fill="url(#g-satin-tail)" />
            <path d="M150 100C120 60 60 30 34 52C14 70 26 110 64 122C96 132 130 116 150 104Z" fill="url(#g-satin)" />
            <path d="M150 100C128 84 96 74 72 80C94 88 124 98 150 104Z" fill="#060d22" fill-opacity=".55" />
            <path d="M44 60C62 46 98 54 128 80" fill="none" stroke="#9fb3e0" stroke-opacity=".38" stroke-width="2.4" stroke-linecap="round" />
            <path d="M34 92C40 110 62 118 86 118" fill="none" stroke="#9fb3e0" stroke-opacity=".2" stroke-width="1.6" stroke-linecap="round" />
            <path d="M142 124C132 152 118 176 102 200" fill="none" stroke="#9fb3e0" stroke-opacity=".25" stroke-width="1.6" stroke-linecap="round" />
          </g>
          <use href="#bow-half" transform="translate(300 0) scale(-1 1)" />
          <ellipse cx="150" cy="102" rx="20" ry="16" fill="url(#g-satin)" />
        </symbol>

        <!-- Detail icons -->
        <symbol id="i-calendar" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
            <rect x="3.5" y="5" width="17" height="15" rx="1.5" /><path d="M3.5 9.5h17M8 3v4M16 3v4" />
            <path d="M12 12.4l.9 1.8 2 .3-1.45 1.4.34 2-1.79-.95-1.79.95.34-2-1.45-1.4 2-.3z" />
          </g>
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
            <circle cx="12" cy="12" r="8.5" /><path d="M12 7v5l3.2 2" />
          </g>
        </symbol>
        <symbol id="i-pin" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
            <path d="M12 21s-6.5-6.4-6.5-11.3A6.5 6.5 0 0 1 18.5 9.7C18.5 14.6 12 21 12 21z" /><circle cx="12" cy="9.7" r="2.4" />
          </g>
        </symbol>
      </defs>
    </svg>

    <div class="atmosphere" aria-hidden="true">
      <div class="atmosphere__glow"></div>
      <div class="atmosphere__grain"></div>
    </div>

    <!-- ===================== ENVELOPE ===================== -->
    <section class="envelope" id="envelope" aria-label="ظرف الدعوة">
      <div class="envelope__bloom" aria-hidden="true"></div>
      <div class="envelope__stage" aria-hidden="true">
        <div class="door door--left">
          <img class="door__art" src="assets/envelope/left-door.jpg" alt="" fetchpriority="high" draggable="false" />
        </div>
        <div class="door door--right">
          <img class="door__art" src="assets/envelope/right-door.jpg" alt="" fetchpriority="high" draggable="false" />
        </div>
      </div>
      <div class="envelope__seam-light" aria-hidden="true"></div>
      <button class="seal" id="seal" type="button" aria-label="افتح الدعوة — ختم محمد وديما" aria-describedby="envelope-hint" aria-controls="invitation">
        <span class="seal__glow" aria-hidden="true"></span>
        <img class="seal__art" src="assets/envelope/wax-seal.png" alt="" fetchpriority="high" draggable="false" />
      </button>
      <p class="envelope__hint" id="envelope-hint">المس الختم</p>
    </section>

    <!-- ===================== INVITATION ===================== -->
    <main class="invitation" id="invitation" inert>
      <h1 class="invitation-cover" id="couple-title" tabindex="-1">
        <img class="invitation-cover__image" src="assets/invitation/invitation-cover.png" width="941" height="1672" alt="دعوة خطوبة محمد وديبه، تتضمن البسملة وآية المودة والرحمة" fetchpriority="high" decoding="async" draggable="false" />
      </h1>
      <div class="invitation-background">
        <img class="invitation-background__image" src="assets/invitation/invitation-background.png" width="941" height="1672" alt="" decoding="async" draggable="false" />
        <section class="engagement-details" aria-labelledby="engagement-heading">
          <h2 class="engagement-details__heading" id="engagement-heading" data-reveal>
            <img class="invitation-calligraphy" src="assets/invitation/invitation-heading.png" width="2172" height="724" alt="ندعوكم لحفلة خطوبتنا" decoding="async" />
          </h2>
          <dl class="engagement-details__list">
            <div class="engagement-details__item engagement-details__item--date" data-reveal>
              <dt class="visually-hidden">التاريخ</dt>
              <dd class="engagement-details__date"><time datetime="2026-10-30">الجمعة، 30 أكتوبر 2026</time></dd>
            </div>
          </dl>
          <dl class="engagement-details__list engagement-details__pair" data-reveal>
            <div class="engagement-details__item">
              <dt>
                <svg class="engagement-details__icon" aria-hidden="true" focusable="false"><use href="#i-clock" /></svg>
                <span>الساعة</span>
              </dt>
              <dd><time datetime="2026-10-30T16:00:00+02:00">الرابعة مساءً</time></dd>
            </div>
            <div class="engagement-details__item">
              <dt>
                <svg class="engagement-details__icon" aria-hidden="true" focusable="false"><use href="#i-pin" /></svg>
                <span>مكان التجمع</span>
              </dt>
              <dd>ساحة البيت</dd>
            </div>
          </dl>
          <section class="engagement-countdown" aria-labelledby="countdown-title">
            <h3 class="engagement-countdown__heading" id="countdown-title" data-reveal>حتى نلتقي</h3>
            <div class="engagement-countdown__units" role="timer" aria-live="off" aria-labelledby="countdown-title" data-reveal>
              <div class="engagement-countdown__unit">
                <span class="engagement-countdown__number" data-unit="days" dir="ltr" lang="en">00</span>
                <span class="engagement-countdown__label">أيام</span>
              </div>
              <div class="engagement-countdown__unit">
                <span class="engagement-countdown__number" data-unit="hours" dir="ltr" lang="en">00</span>
                <span class="engagement-countdown__label">ساعة</span>
              </div>
              <div class="engagement-countdown__unit">
                <span class="engagement-countdown__number" data-unit="minutes" dir="ltr" lang="en">00</span>
                <span class="engagement-countdown__label">دقيقة</span>
              </div>
            </div>
          </section>
          <footer class="invitation-closing" data-reveal>
            <img class="invitation-calligraphy" src="assets/invitation/invitation-closing.png" width="866" height="288" alt="بوجودكم تكتمل فرحتنا" decoding="async" />
          </footer>
        </section>
      </div>

    </main>

    <script src="script.js"></script>
  </body>
</html>
